{{ define "main" }}
<canvas class="hero-matrix-bg" id="heroMatrixBg" aria-hidden="true"></canvas>
{{ partial "sidebar-profile.html" . }}
<div class="wrap" style="margin-top:2.5rem;">
  <h1>{{ .Title }}</h1>
  <p class="post-meta"><a href="{{ "posts/" | relURL }}">← Ver por páginas</a></p>

  <div style="margin-top:1.5rem;">
    {{ $posts := where .Site.RegularPages "Type" "posts" }}
    {{ range sort $posts "Date" "desc" }}
    {{ partial "post-card.html" . }}
    {{ end }}
  </div>
</div>
{{ end }}
