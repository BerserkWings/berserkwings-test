<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">

<!-- =========================================================
     OWASP / cabeceras de seguridad — notas honestas
     =========================================================
     GitHub Pages no permite mandar cabeceras HTTP reales, solo lo que
     se puede meter en el HTML. Eso divide las protecciones típicas en
     dos grupos MUY distintos:

     SÍ funcionan puestas aquí como <meta>:
       - Content-Security-Policy (con excepciones, ver abajo)
       - <meta name="referrer"> (Referrer-Policy)

     NO funcionan puestas aquí, aunque se vean bien escritas (los
     navegadores las ignoran por completo si no llegan como cabecera
     HTTP real — está confirmado en la documentación de MDN y OWASP):
       - X-Content-Type-Options
       - X-Frame-Options
       - la directiva frame-ancestors DENTRO del CSP (aunque el resto
         del mismo CSP sí funciona)
       - Strict-Transport-Security (HSTS)
     Por eso NO las ponemos aquí: un meta tag roto que aparenta
     protección es peor que no ponerlo, porque engaña a quien audite
     el sitio (incluido tú) a pensar que hay una protección que no
     existe. Si en algún momento quieres esas protecciones de verdad,
     la opción es poner Cloudflare (gratis) delante de tu dominio y
     usar sus "Transform Rules" para inyectar cabeceras HTTP reales, o
     migrar el hosting a algo que sí las soporte (Cloudflare Pages,
     Netlify). GitHub Pages sí manda HSTS automáticamente en el propio
     dominio *.github.io, así que esa en particular no hace falta
     simularla.

     Como respaldo mientras tanto, contra clickjacking usamos también
     un "frame buster" en JavaScript (ver assets/js/main.js) — no es
     tan robusto como una cabecera real, pero es mejor que nada.

     img-src está cerrado a 'self' porque hoy TODAS tus imágenes están
     hosteadas en el propio sitio (revisé los 149 posts, ninguno carga
     una imagen de un dominio externo de verdad). Si algún día agregas
     una insignia externa (ej. un badge de shields.io) vas a necesitar
     agregar ese dominio aquí explícitamente, o el navegador la bloqueará. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               img-src 'self';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' https://fonts.gstatic.com;
               script-src 'self' {{ if .Site.Params.ga4_id }}https://www.googletagmanager.com 'unsafe-inline'{{ end }};
               connect-src 'self' {{ if .Site.Params.ga4_id }}https://*.google-analytics.com https://www.googletagmanager.com{{ end }};
               object-src 'none';
               base-uri 'self';
               form-action 'self';
               upgrade-insecure-requests;">
<meta name="referrer" content="strict-origin-when-cross-origin">

<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" href="{{ "assets/images/favicon.png" | absURL }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

{{ $css := resources.Get "css/main.css" | resources.Minify | resources.Fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">

<!-- Open Graph básico -->
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
{{ if .Params.header.teaser }}<meta property="og:image" content="{{ .Params.header.teaser | strings.TrimPrefix "/" | absURL }}">{{ end }}

{{ if .Site.Params.ga4_id }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ .Site.Params.ga4_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ .Site.Params.ga4_id }}', { anonymize_ip: true });
</script>
{{ end }}
